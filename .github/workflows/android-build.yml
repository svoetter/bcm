name: Android Build - APK und AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          # Das alte Paket "tools" gibt es nicht mehr; ohne diese Zeile bricht der Schritt ab.
          packages: "platform-tools"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug APK bauen
        run: gradle :app:assembleDebug

      - name: Release AAB bauen
        run: gradle :app:bundleRelease

      - name: Dateien sammeln
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/*.apk output/ || true
          cp app/build/outputs/bundle/release/*.aab output/ || true

      - name: APK und AAB als Artifact speichern
        uses: actions/upload-artifact@v4
        with:
          name: risikoanalyse-android-build
          path: output/*
